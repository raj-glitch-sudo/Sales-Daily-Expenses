<style>

.kvt{width:100%}.kvt td{vertical-align:middle;white-space:normal!important}.kvt td small{display:block;color:var(--muted);font-weight:400;margin-top:2px}.kvt td:last-child{white-space:nowrap;width:1%}.kvt input{width:130px}.kvt #fpSil{width:70px}

/* ---------- AJ Sales ---------- */
.tabwarn{margin:10px 16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;margin-top:12px}.g2>.card{margin:0}
.kpi small{display:block;font-size:.76rem;color:var(--muted);margin-top:2px}
.alert.ok{background:var(--ok2);color:var(--ok);border-color:#b7e4cf}.alert.warn{background:var(--warn2)}
.mut td{opacity:.6}.pos{color:var(--ok)}.neg{color:var(--danger)}.pvx{color:var(--muted)}
.steps{margin:6px 0 10px;padding-left:20px;line-height:1.7}
ul.chk{list-style:none;margin:8px 0;padding:0;display:grid;gap:5px}ul.chk li{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:.88rem;background:#fff}
ul.chk li.bad{background:var(--danger2);border-color:#f5c2bd;color:#7a1a12}ul.chk li.warn{background:var(--warn2);border-color:#f1d49b;color:#5c3a00}ul.chk li.info{background:var(--brand2);border-color:#bfe0d6}ul.chk li.ok{background:var(--ok2);border-color:#b7e4cf}
.t tr.gt td,.t tfoot tr.gt td{font-weight:700;background:#eef6f3}.t tr.tt td{font-weight:700;border-top:1px solid var(--line)}
.kvt td{white-space:normal}.kvt td.n{white-space:nowrap}
.daybar{gap:6px;flex-wrap:wrap}.daybar input[type=date]{width:150px}.dlong{margin:0 6px;font-size:1.02rem}
.daysum{margin:10px 0}.daysum .neg b{color:var(--danger)}
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px;margin-top:10px;align-items:start}
.slipc{margin:0;padding:12px 14px}.slipc.empty{opacity:.88;border-style:dashed}.slh{gap:8px;margin-bottom:6px}.slh h3{margin:0;font-size:1.05rem}.slh select{width:auto;min-width:130px;max-width:170px}
.zl{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted)}.zl input{width:120px}
input.num{text-align:right;font-variant-numeric:tabular-nums}
table.t.sl td,table.t.sl th{padding:3px 6px}.sl td:first-child{font-weight:600;width:34%}.sl input{width:100%;min-width:90px;padding:5px 7px}
.slf{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 2px 4px;font-size:.86rem}.slf b{font-size:1rem}
.sld{border:1px solid var(--line2);border-radius:9px;margin-top:6px;background:#fbfdfc}.sld summary{cursor:pointer;padding:6px 10px;font-weight:600;font-size:.86rem}.sld summary span{font-weight:500;color:var(--muted)}.sld summary span.neg{color:var(--danger)}.sld>div{padding:4px 10px 10px}
.cnt .row{gap:10px;align-items:flex-start}.cnt .fg{flex:1;min-width:150px}
.den{width:auto;margin:6px 0}table.t.den td{padding:2px 8px;border:0}.den input{width:70px;padding:4px 6px}.den td.n{min-width:90px}
table.t.dt td,table.t.dt th{padding:3px 5px}.dt input,.dt select{padding:4px 6px;min-width:80px}.dt input[type=date]{min-width:130px}
.slnote{margin-top:8px;width:100%}
.bars{width:100%;height:170px;display:block}.bars rect{fill:var(--brand)}.bars rect.open{fill:#8fc9b8}.bars text{font-size:9px;fill:var(--muted)}
.hb{display:grid;gap:6px}.hb>div{display:grid;grid-template-columns:150px 1fr 120px;gap:8px;align-items:center;font-size:.86rem}.hb i{display:block;height:10px;background:var(--line2);border-radius:99px;overflow:hidden}.hb i b{display:block;height:100%;background:var(--brand);border-radius:99px}.hb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.t.grid{font-size:.84rem}.t.grid th.gh{text-align:center;border-left:1px solid var(--line)}.t.grid td.tc,.t.grid th.tc{background:#f3f9f7;font-weight:700}
.t.je tr.g td{white-space:normal}
.exadd{align-items:flex-end;gap:8px}.exadd .fg{margin:0;min-width:120px}.exadd .fg:nth-child(2){flex:2;min-width:220px}
@media(max-width:900px){.slips{grid-template-columns:1fr}.slipc{overflow-x:auto}table.t.sl input{min-width:72px}.zl input{width:96px}.hb>div{grid-template-columns:100px 1fr 100px}.g2{grid-template-columns:1fr}}

// ---------------------------------------------------------------- one counter slip
// collected = what the cashier turned over (POS + manual, by payment option)
// variance = POS collections less the POS Z-reading (over is +, short is −); sales = collected less variance

 const by={},posBy={},manBy={};DB.opts.forEach(o=>{const p=s.pos[o.id]||0,m=s.man[o.id]||0;if(p||m){by[o.id]=p+m;posBy[o.id]=p;manBy[o.id]=m}});
 Object.keys(s.pos).concat(Object.keys(s.man)).forEach(k=>{if(by[k]==null&&((s.pos[k]||0)||(s.man[k]||0))){posBy[k]=s.pos[k]||0;manBy[k]=s.man[k]||0;by[k]=posBy[k]+manBy[k]}});

const slipEmpty=s=>!s.cashier&&!Object.values(s.pos).some(Boolean)&&!Object.values(s.man).some(Boolean)&&!(s.z!=null&&s.z!=='')&&!denTotal(s)&&!(s.pu||[]).length&&!(s.note||'').trim();
// totals for a list of slips
function totals(L){const t={gross:0,sales:0,vr:0,pos:0,man:0,by:{},n:L.length};L.forEach(s=>{const c=slipCalc(s);t.gross+=c.gross;t.sales+=c.sales;t.vr+=c.vr;t.pos+=c.posT;t.man+=c.manT;Object.entries(c.by).forEach(([k,v])=>t.by[k]=(t.by[k]||0)+v)});return t}
const kindTot=(t,kind)=>Object.entries(t.by).reduce((s,[k,v])=>s+(optById(k).kind===kind?v:0),0);
const slipsIn=(a,b)=>DB.slips.filter(s=>inRange(s.date,a,b));
const expsIn=(a,b)=>DB.exps.filter(e=>inRange(e.date,a,b));
const catById=id=>DB.cats.find(c=>c.id===id)||{id,name:id||'(no category)',group:''};

// ---------------------------------------------------------------- checks received (from slip check details)
// a check is postdated when its check date is after the day it was received
function allChecks(){const L=[];DB.slips.forEach(s=>(s.checks||[]).forEach(c=>L.push(Object.assign({slip:s.id,recv:s.date,counter:s.counter},c,{pdc:!!(c.date&&c.date>s.date)}))));return L}
const depositedChecks=(upto)=>{const m=new Map();DB.moves.forEach(x=>{if(x.type==='chkdep'&&(!upto||x.date<=upto))(x.checks||[]).forEach(id=>m.set(id,x))});return m};

// ---------------------------------------------------------------- balances as of a date (only from the start date in Settings › Balances)
function balances(asOf){
 const st=S().start||'',O=S().open||{},d=asOf||'9999-12-31',L=DB.slips.filter(s=>s.date>=st&&s.date<=d),M=DB.moves.filter(x=>x.date>=st&&x.date<=d);
 const B={cash:O.cash||0,kiosk:O.kiosk||0,check:O.check||0,recv:{},repa:{},pdc:0,unassigned:0};
 DB.opts.filter(o=>o.kind==='recv').forEach(o=>B.recv[o.id]=(O.recv||{})[o.id]||0);

 L.forEach(s=>{const c=slipCalc(s);Object.entries(c.by).forEach(([k,v])=>{const o=optById(k);
  if(o.kind==='cash')B.cash+=v;else if(o.kind==='kiosk')B.kiosk+=v;else if(o.kind==='check')B.check+=v;else if(o.kind==='recv')B.recv[k]=(B.recv[k]||0)+v;
  else if(o.kind==='repa'){let left=v;(s.repa||[]).forEach(r=>{if(r.group){B.repa[r.group]=(B.repa[r.group]||0)-r.amt;left-=r.amt}});B.unassigned-=left}})});
 M.forEach(x=>{if(x.type==='cashdep')B.cash-=x.amt;else if(x.type==='chkdep')B.check-=x.amt;else if(x.type==='kiosk')B.kiosk-=x.amt;
  else if(x.type==='recv'){B.recv[x.opt]=(B.recv[x.opt]||0)-x.amt;if(x.to==='cash')B.cash+=x.amt}
  else if(x.type==='repa'){B.repa[x.group]=(B.repa[x.group]||0)+x.amt;if(x.to==='cash')B.cash+=x.amt}
  else if(x.type==='repaout'){B.repa[x.group]=(B.repa[x.group]||0)-x.amt;if(x.to==='cash')B.cash-=x.amt}

// ---------------------------------------------------------------- journal entries (one per day for sales, one per expense, one per money movement)
function salesJE(d){
 const L=slipsOn(d);if(!L.length)return null;const T={},add=(a,dr,cr)=>{if(!dr&&!cr)return;T[a]=T[a]||{dr:0,cr:0};T[a].dr+=dr||0;T[a].cr+=cr||0};
 let sales=0,vr=0;
 L.forEach(s=>{const c=slipCalc(s);sales+=c.sales;vr+=c.vr;Object.entries(c.by).forEach(([k,v])=>{const o=optById(k);
  if(o.kind==='check'){const pd=sum((s.checks||[]).filter(x=>x.date&&x.date>s.date),'amt');add(A().pdc,Math.min(pd,v));add(o.acct||'Checks on Hand',v-Math.min(pd,v))}
  else add(o.acct||o.name,v)})});
 if(S().vat){const net=Math.round(sales/1.12);add(A().sales,0,net);add(A().vat,0,sales-net)}else add(A().sales,0,sales);

 return{date:d,memo:'Sales for '+fd(d)+' ('+L.length+' counter'+(L.length>1?'s':'')+')',lines:Object.entries(T).map(([a,v])=>({a,dr:v.dr,cr:v.cr})).filter(x=>x.dr||x.cr).sort((x,y)=>(y.dr>0)-(x.dr>0))}}
const MOVE_T={cashdep:'Cash deposited to bank',chkdep:'Checks deposited to bank',kiosk:'Kiosk (Maya) settlement received',recv:'Collection from partner',repa:'Repa contribution received',repaout:'Repa refund / payout',cashadj:'Cash count adjustment'};
function moveJE(x){const a=A(),o=x.opt?optById(x.opt):null,g=x.group?grpById(x.group):null,to=x.to==='cash'?a.cash:a.bank;let L=[];
 if(x.type==='cashdep')L=[[a.bank,x.amt,0],[a.cash,0,x.amt]];
 else if(x.type==='chkdep')L=[[a.bank,x.amt,0],[(DB.opts.find(o=>o.kind==='check')||{}).acct||'Checks on Hand',0,x.amt]];
 else if(x.type==='kiosk')L=[[a.bank,x.amt,0],[(DB.opts.find(o=>o.kind==='kiosk')||{}).acct||'Maya Receivable',0,x.amt]];

 else if(x.type==='repaout')L=[[(DB.opts.find(o=>o.kind==='repa')||{}).acct||'Repa Deposits',x.amt,0],[to,0,x.amt]];

// ---------------------------------------------------------------- checks before a day is closed
function dayChecks(d){const I=[],ctrs=countersOn(d).filter(c=>c.active!==false),L=slipsOn(d);

function cashBook(a,b){const st=S().start||'',open=balances(addDays(a,-1)).cash,R=[];
 for(let d=a;d<=b;d=addDays(d,1)){if(st&&d<st)continue;const L=slipsOn(d),co=DB.opts.filter(o=>o.kind==='cash').map(o=>o.id);
  const cin=sum(L,s=>{const c=slipCalc(s);return co.reduce((t,k)=>t+(c.by[k]||0),0)}),M=DB.moves.filter(x=>x.date===d);
  const coll=sum(M.filter(x=>['recv','repa'].includes(x.type)&&x.to==='cash'),'amt'),dep=sum(M.filter(x=>x.type==='cashdep'),'amt'),out=sum(M.filter(x=>x.type==='repaout'&&x.to==='cash'),'amt'),adj=sum(M.filter(x=>x.type==='cashadj'),'amt');
  const exp=sum(DB.exps.filter(e=>e.date===d&&modeAcct(e.mode)===A().cash),'amt');
  if(cin||coll||dep||exp||out||adj)R.push({d,cin,coll:coll+adj,dep,exp:exp+out})}
 let run=open;R.forEach(r=>{r.open=run;run+=r.cin+r.coll-r.dep-r.exp;r.close=run});return{open,R,close:run}}

// grid: groups of columns over a list of rows; returns screen, print and CSV
function gridRep(groups,rows,rowLabel,opts){opts=opts||{};
 const cols=[];groups.forEach(g=>g.cols.forEach(c=>cols.push(c)));
 const vals=rows.map(r=>cols.map(c=>c.f(r)||0)),tot=cols.map((c,i)=>sum(vals,v=>v[i]));
 const keep=cols.map((c,i)=>c.keep||tot[i]!==0);
 const G=groups.map(g=>({label:g.label,cols:g.cols.filter(c=>keep[cols.indexOf(c)])})).filter(g=>g.cols.length);
 const idx=G.flatMap(g=>g.cols.map(c=>cols.indexOf(c)));
 const h1='<tr><th rowspan="2">'+esc(opts.first||'Date')+'</th>'+G.map(g=>'<th colspan="'+g.cols.length+'" class="gh">'+esc(g.label)+'</th>').join('')+'</tr>',h2='<tr>'+G.flatMap(g=>g.cols.map(c=>'<th class="n'+(c.tot?' tc':'')+'">'+esc(c.label)+'</th>')).join('')+'</tr>';
 const line=(lab,v,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td>'+lab+'</td>'+idx.map(i=>'<td class="n r'+(cols[i].tot?' tc':'')+'">'+m2(v[i])+'</td>').join('')+'</tr>';
 const body=rows.map((r,k)=>opts.skipEmpty&&!vals[k].some(Boolean)?'':line(rowLabel(r),vals[k])).join('');
 const foot=line(opts.totLabel||'TOTAL',tot,'gt');
 return{screen:'<div class="tw"><table class="t grid"><thead>'+h1+h2+'</thead><tbody>'+(body||'<tr><td colspan="'+(idx.length+1)+'" class="empty">Nothing to show.</td></tr>')+'</tbody><tfoot>'+foot+'</tfoot></table></div>',
  print:'<table class="rt">'+'<thead>'+h1+h2+'</thead><tbody>'+body.replace(/<a [^>]*>|<\/a>/g,'')+foot+'</tbody></table>',
  csv:()=>toCsv([[opts.first||'Date'].concat(G.flatMap(g=>g.cols.map(c=>g.label+' – '+c.label)))].concat(rows.map((r,k)=>opts.skipEmpty&&!vals[k].some(Boolean)?null:[opts.csvLabel?opts.csvLabel(r):r].concat(idx.map(i=>p2(vals[k][i])))).filter(Boolean)).concat([['TOTAL'].concat(idx.map(i=>p2(tot[i])))])),tot,cols,idx}}
